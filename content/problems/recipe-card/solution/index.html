<!DOCTYPE html>
<html>
  <head>
    <title>Pancakes</title>
  </head>
  <body>
    <h1>Pancakes</h1>

    <h2>Ingredients</h2>
    <ul>
      <li>1 cup flour</li>
      <li>1 cup milk</li>
      <li>1 egg</li>
      <li>2 tablespoons sugar</li>
    </ul>

    <h2>Steps</h2>
    <ol>
      <li>Whisk the dry ingredients together in a bowl.</li>
      <li>Stir in the milk and egg, but <strong>do not overmix</strong>.</li>
      <li>Pour scoops of batter onto a hot pan.</li>
      <li>Flip when bubbles form, then cook one more minute.</li>
    </ol>
  </body>
</html>

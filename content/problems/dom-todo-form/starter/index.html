<!DOCTYPE html>
<html>
  <head>
    <title>Todos</title>
    <style>
      li {
        cursor: pointer;
      }
      .done {
        text-decoration: line-through;
        color: gray;
      }
    </style>
  </head>
  <body>
    <h1>Todos</h1>
    <form id="todo-form">
      <label for="todo-input">New todo</label>
      <input id="todo-input" type="text" />
      <button type="submit">Add</button>
    </form>
    <ul id="todo-list"></ul>
    <p id="count">0 todos</p>
    <script src="index.js"></script>
  </body>
</html>
